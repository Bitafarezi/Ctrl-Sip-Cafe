{% extends "base.html" %}

{% block content %}
<div class="col-md-2"></div>

<div class="col-md-8 border rounded p-3">
    <h3 class="text-muted">Your Order Amount is: {{order.get_total_price}} Toman</h3>
    <hr>
    <p><b>Do you want to continue and pay?</b></p>
    <a href="{% url 'cart:show_cart' %}" class="btn btn-danger">Back To Cart</a>
    <form action="{% url 'orders:fake_payment' order.id %}" method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-success">Continue and pay</button>
    </form>
<div class="col-md-2"></div>

{% endblock %}
