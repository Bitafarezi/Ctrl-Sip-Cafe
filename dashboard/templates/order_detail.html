{% extends "dashboard.html" %}

{% block content %}
<div class="lux-order-card">
  {% if order.status %}
    <span class="lux-badge lux-badge-success mb-3 d-inline-block">Successful</span>
  {% else %}
    <span class="lux-badge lux-badge-danger mb-3 d-inline-block">Cancelled</span>
  {% endif %}

  {% for item in items %}
  <div class="lux-receipt-row">
    <div>
      <a href="{{ item.product.get_absolute_url }}" class="lux-link">{{ item.product.title }}</a>
      <small class="d-block" style="color:var(--cream-muted);">{{ item.quantity }} × {{ item.price }} T</small>
    </div>
  </div>
  {% endfor %}

  <p class="lux-detail-price mt-3 mb-0">Total · {{ order.get_total_price }} T</p>
</div>
{% endblock %}
