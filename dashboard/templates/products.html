{% extends "dashboard.html" %}

{% block content %}
<div class="lux-panel">
  <div class="lux-table-wrap">
    <table class="lux-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Title</th>
          <th>Price</th>
          <th>Category</th>
          <th>Date</th>
          <th></th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for product in products %}
        <tr>
          <td>{{ forloop.counter }}</td>
          <td><a href="{{ product.get_absolute_url }}" class="lux-link">{{ product.title }}</a></td>
          <td>{{ product.price }} T</td>
          <td>{{ product.category }}</td>
          <td>{{ product.date_created|date:"M d" }}</td>
          <td><a href="{% url 'dashboard:delete_product' product.id %}" class="lux-link-danger">Delete</a></td>
          <td><a href="{% url 'dashboard:edit_product' product.id %}" class="lux-link">Edit</a></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
