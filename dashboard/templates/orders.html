{% extends "dashboard.html" %}
{% block content %}
<div class="lux-panel">
  <div class="lux-table-wrap">
    <table class="lux-table">
      <thead>
        <tr>
          <th>#</th>
          <th>User</th>
          <th>ID</th>
          <th>Total</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for order in orders %}
        <tr>
          <td>{{ forloop.counter }}</td>
          <td>{{ order.user.full_name }}</td>
          <td>{{ order.id }}</td>
          <td>{{ order.get_total_price }} T</td>
          <td>{% if order.status %}<span class="lux-badge lux-badge-success">Paid</span>{% else %}<span class="lux-badge lux-badge-danger">Cancelled</span>{% endif %}</td>
          <td><a href="{% url 'dashboard:order_detail' order.id %}" class="lux-link">Detail</a></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
