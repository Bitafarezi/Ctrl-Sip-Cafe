{% extends "dashboard.html" %}
{% block content %}
<div class="lux-panel lux-form">
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <hr style="border-color:rgba(201,169,98,0.15);margin:2rem 0;">
    <p class="lux-page-label mb-3">Additional Images</p>
    {{ formset.management_form }}
    {% for image_form in formset %}
    <div class="lux-panel mb-2" style="padding:1rem;">
      <label class="form-label">Image {{ forloop.counter }}</label>
      {{ image_form.image }}
      <label class="form-label mt-2">Order</label>
      {{ image_form.order }}
    </div>
    {% endfor %}
    <button class="lux-btn lux-btn-primary w-100 mt-3" type="submit">Submit</button>
  </form>
</div>
{% endblock %}
