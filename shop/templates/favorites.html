{% extends 'base.html' %}

{% block content %}
<div class="lux-page-header lux-reveal" style="opacity:1;transform:none;">
  <p class="lux-page-label">Saved Items</p>
  <h1 class="lux-page-title">Your Favorites</h1>
  <div class="lux-page-divider"></div>
</div>

{% if products %}
<div class="lux-grid">
{% for product in products %}
  <div class="lux-card" data-tilt>
    <img src="{{ product.image.url }}" alt="{{ product.title }}" height="260">
    <div class="lux-card-body">
      <h3 class="lux-card-title">{{ product.title }}</h3>
      <p class="lux-card-price">{{ product.price }} T</p>
      <a href="{{ product.get_absolute_url }}" class="lux-btn lux-btn-outline w-100 mb-2">Order Now</a>
      <a href="{% url 'shop:remove_from_favorites' product.id %}" class="lux-btn lux-btn-danger-outline w-100">Remove</a>
    </div>
  </div>
{% endfor %}
</div>
{% else %}
<div class="lux-empty">
  <h3>Your favorites list is empty</h3>
  <a href="{% url 'shop:home_page' %}" class="lux-btn lux-btn-primary">Explore Shop</a>
</div>
{% endif %}
{% endblock %}
