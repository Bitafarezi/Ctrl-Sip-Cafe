{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="lux-panel lux-panel-sm lux-form lux-reveal" style="opacity:1;transform:none;">
  <div class="lux-page-header text-center" style="margin-bottom:1.5rem;">
    <p class="lux-page-label">Account</p>
    <h1 class="lux-page-title" style="font-size:2.2rem;">Edit Profile</h1>
    <div class="lux-page-divider" style="margin:1rem auto;"></div>
  </div>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="avatar-wrapper">
      <label for="id_avatar" class="avatar-container" title="Change avatar">
        {% if form.instance.avatar %}
          <img src="{{ form.instance.avatar.url }}" id="avatar-img" class="avatar-preview" alt="Avatar">
        {% else %}
          <img src="{% static 'images/default.jpeg' %}" id="avatar-img" class="avatar-preview" alt="Default">
        {% endif %}
      </label>
      <label for="id_avatar" class="avatar-hint" title="Upload">📷</label>
      {% if form.instance.avatar %}
      <button type="button" id="btn-delete-avatar" class="avatar-delete-btn" title="Delete">🗑</button>
      {% endif %}
      <input type="checkbox" name="avatar-clear" id="avatar-clear_id" style="display:none;">
      <input type="file" name="avatar" id="id_avatar" style="display:none;" accept="image/*">
    </div>

    {{ form.full_name|as_crispy_field }}
    {{ form.email|as_crispy_field }}

    <button class="lux-btn lux-btn-primary w-100 mt-4" type="submit">Update Profile</button>
  </form>
</div>

<script>
const avatarInput = document.getElementById('id_avatar');
const avatarImg = document.getElementById('avatar-img');
const btnDelete = document.getElementById('btn-delete-avatar');
const clearCheckbox = document.getElementById('avatar-clear_id');
const defaultAvatarUrl = "{% static 'images/default.jpeg' %}";

avatarInput.addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = e => { avatarImg.src = e.target.result; };
    reader.readAsDataURL(file);
    if (clearCheckbox) clearCheckbox.checked = false;
    if (btnDelete) btnDelete.style.display = 'flex';
  }
});
if (btnDelete) {
  btnDelete.addEventListener('click', function() {
    avatarImg.src = defaultAvatarUrl;
    if (clearCheckbox) clearCheckbox.checked = true;
    avatarInput.value = "";
    this.style.display = 'none';
  });
}
</script>
{% endblock %}
