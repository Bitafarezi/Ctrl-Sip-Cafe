{% extends "base.html" %}

{% block content %}
<div class="lux-panel lux-panel-sm lux-reveal text-center" style="opacity:1;transform:none;">
  <p class="lux-page-label">Check Your Inbox</p>
  <h1 class="lux-page-title" style="font-size:1.8rem;margin:1rem 0;">Email Sent</h1>
  <p style="color:var(--cream-muted);line-height:1.8;">An email has been sent with instructions to reset your password.</p>
  <a href="{% url 'users:user_login' %}" class="lux-btn lux-btn-outline mt-4">Back to Login</a>
</div>
{% endblock %}
