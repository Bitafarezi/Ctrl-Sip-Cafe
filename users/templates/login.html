{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="lux-panel lux-panel-sm lux-form lux-reveal" style="opacity:1;transform:none;">
  <div class="lux-page-header" style="margin-bottom:2rem;">
    <p class="lux-page-label">Welcome Back</p>
    <h1 class="lux-page-title" style="font-size:2.2rem;">Login</h1>
    <div class="lux-page-divider"></div>
  </div>

  <form method="POST">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="lux-btn lux-btn-primary w-100 mt-3" type="submit">Sign In</button>
  </form>

  <p class="mt-3 mb-2" style="font-size:0.85rem;color:var(--cream-muted);">
    <a class="lux-link-danger" href="{% url 'users:password_reset' %}">Forgot password?</a>
  </p>
  <p style="font-size:0.85rem;color:var(--cream-muted);">
    New here? <a class="lux-link" href="{% url 'users:user_register' %}">Create account</a>
  </p>
</div>
{% endblock %}
