{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<style>
    .btn-boho-submit {
        background-color: #bc6c25 !important;
        border-color: #bc6c25 !important;
        color: #fff !important;
        transition: all 0.2s ease-in-out;
    }
    .btn-boho-submit:hover, .btn-boho-submit:focus {
        background-color: #dda15e !important;
        border-color: #dda15e !important;
        box-shadow: 0 0 0 0.25rem rgba(221, 161, 94, 0.4) !important;
    }

    .form-control:focus {
        border-color: #dda15e !important;
        box-shadow: 0 0 0 0.25rem rgba(221, 161, 94, 0.2) !important;
    }

    .link-boho-danger {
        color: #b84a39 !important;
        font-weight: 500;
    }
    .link-boho-danger:hover {
        color: #e65c45 !important;
    }

    .link-boho-main {
        color: #bc6c25 !important;
        font-weight: bold;
    }
    .link-boho-main:hover {
        color: #dda15e !important;
    }
</style>

<div class="row justify-content-center mt-5">
    <div class="col-md-6 p-4 rounded" style="background-color: rgba(255, 255, 255, 0.85); border: 1px solid #ebdcd0;">
        <form method="POST">
            {% csrf_token %}
            <h3 class="fw-bold" style="color: #606c38;">Login</h3>
            <hr style="border-color: #dda15e;">
            
            {{ form|crispy }}
            
            <div class="form-group">
                <button class="btn btn-boho-submit mt-3 w-100 py-2 fw-bold" type="submit">Submit</button>
            </div>
            
            <div class="mt-3 mb-2">
                <small>
                    <a class="text-decoration-none link-boho-danger" href="{% url 'users:password_reset' %}">Forgot Password?</a>
                </small>
            </div>
        </form>
        
        <div class="border-top pt-3 mt-3" style="border-color: #ebdcd0 !important;">
            <small class="text-muted">
                New Here? <a class="text-decoration-none link-boho-main" href="{% url 'users:user_register' %}">Create account</a>
            </small>
        </div>
    </div>
</div>
{% endblock %}
