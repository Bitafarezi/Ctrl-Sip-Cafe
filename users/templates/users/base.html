{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ctrl+Sip Cafe{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'users/css/styles.css' %}">
</head>

<body>

    <header>
        <h1>Ctrl+Sip Café ☕</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Menu</a>
            {% if user.is_authenticated %}
                <a href="#">Profile ({{ user.phone_number }})</a>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Sign Up</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 - All Rights Reserved | Ctrl+Sip Café Development Team</p>
    </footer>

</body>
</html>
