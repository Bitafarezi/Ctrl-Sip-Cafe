{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="lux-panel lux-panel-sm lux-form lux-reveal" style="opacity:1;transform:none;max-width:420px;">
  <div class="lux-page-header" style="margin-bottom:2rem;">
    <p class="lux-page-label">Management</p>
    <h1 class="lux-page-title" style="font-size:2rem;">Dashboard Login</h1>
    <div class="lux-page-divider"></div>
  </div>

  <form method="post">
    {% csrf_token %}
    {% if messages %}
      {% for message in messages %}
        <div class="lux-alert lux-alert-{{ message.extra_tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    <div class="lux-form">{{ form|crispy }}</div>
    <button class="lux-btn lux-btn-primary w-100 mt-3" type="submit">Sign In</button>
  </form>

  <p class="mt-3" style="font-size:0.85rem;color:var(--cream-muted);">
    <a href="{% url 'shop:landing' %}" class="lux-link">Back to site</a>
  </p>
</div>
{% endblock %}
