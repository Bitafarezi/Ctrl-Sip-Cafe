{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="lux-panel lux-panel-sm lux-form lux-reveal" style="opacity:1;transform:none;">
  <div class="lux-page-header" style="margin-bottom:2rem;">
    <p class="lux-page-label">Join Us</p>
    <h1 class="lux-page-title" style="font-size:2.2rem;">Create Account</h1>
    <div class="lux-page-divider"></div>
  </div>

  <form method="POST">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="lux-btn lux-btn-primary w-100 mt-3" type="submit">Register</button>
  </form>

  <p class="mt-3" style="font-size:0.85rem;color:var(--cream-muted);">
    Already have an account? <a class="lux-link" href="{% url 'users:user_login' %}">Login</a>
  </p>
</div>
{% endblock %}
