{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="lux-panel lux-panel-sm lux-form lux-reveal" style="opacity:1;transform:none;">
  <div class="lux-page-header" style="margin-bottom:2rem;">
    <p class="lux-page-label">New Password</p>
    <h1 class="lux-page-title" style="font-size:2rem;">Reset Password</h1>
    <div class="lux-page-divider"></div>
  </div>
  <form method="POST">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="lux-btn lux-btn-primary w-100 mt-3" type="submit">Update Password</button>
  </form>
</div>
{% endblock %}
